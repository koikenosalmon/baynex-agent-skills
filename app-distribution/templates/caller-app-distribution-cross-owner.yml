# Use this variant when the calling repository is owned by a different account or organization than koikenosalmon.
# Inheriting secrets does not work across owners, so every secret is passed explicitly.
name: App Distribution
on:
  push:
    branches:
      - qa
      - 'release/**'
      - 'ai/feature-*'
      - 'feature/**'
      - 'epic/**'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  distribute:
    uses: koikenosalmon/baynex-agent-skills/.github/workflows/app-distribution.yml@v1
    with:
      config-path: distribution/apps.json
      kit-ref: v1
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      GIT_DEPENDENCY_SSH_KEY: ${{ secrets.GIT_DEPENDENCY_SSH_KEY }}
      GIT_DEPENDENCY_TOKEN: ${{ secrets.GIT_DEPENDENCY_TOKEN }}
