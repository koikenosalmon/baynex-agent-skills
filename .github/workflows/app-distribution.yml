name: App Distribution

on:
  workflow_call:
    inputs:
      config-path:
        type: string
        default: distribution/apps.json
      kit-ref:
        type: string
        default: v1
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
        description: Base64-encoded Android upload keystore
      ANDROID_KEYSTORE_PASSWORD:
        required: false
        description: Android keystore password
      ANDROID_KEY_ALIAS:
        required: false
        description: Android signing key alias
      ANDROID_KEY_PASSWORD:
        required: false
        description: Android signing key password
      APP_STORE_CONNECT_KEY_P8:
        required: false
        description: App Store Connect API key (.p8 contents)
      APP_STORE_CONNECT_KEY_ID:
        required: false
        description: App Store Connect API key ID
      APP_STORE_CONNECT_ISSUER_ID:
        required: false
        description: App Store Connect issuer ID
      GIT_DEPENDENCY_SSH_KEY:
        required: false
        description: Deploy key for private Git dependencies
      GIT_DEPENDENCY_TOKEN:
        required: false
        description: Token for private Git dependencies

env:
  DISTRIBUTION_CONFIG: ${{ inputs.config-path }}

concurrency:
  group: app-distribution-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      # Only flags and matrix indices leave this job. Config values (project ids, bundle ids, ...)
      # are re-read from apps.json inside each job: GitHub drops any output containing a masked secret.
      app_present: ${{ steps.config.outputs.app_present }}
      matrix: ${{ steps.config.outputs.matrix }}
      wif_ready: ${{ steps.config.outputs.wif_ready }}
      android_signing: ${{ steps.config.outputs.android_signing }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: koikenosalmon/baynex-agent-skills
          ref: ${{ inputs.kit-ref }}
          path: .baynex-app-distribution-kit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve distribution configuration
        run: node .baynex-app-distribution-kit/app-distribution/scripts/resolve-config.mjs
      - id: config
        name: Check app and prerequisites
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.FIREBASE_UPLOADER_SERVICE_ACCOUNT }}
          ANDROID_KEYSTORE_SET: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          ANDROID_STORE_PASSWORD_SET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          ANDROID_ALIAS_SET: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          ANDROID_KEY_PASSWORD_SET: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import { validateApps } from "./.baynex-app-distribution-kit/app-distribution/scripts/app-store-connect.mjs"; validateApps(JSON.parse(readFileSync(process.env.DISTRIBUTION_CONFIG, "utf8")));'
          app_dir=$(jq -r '.appDir // "native"' "$DISTRIBUTION_CONFIG")
          jq -c '[range(0; (.apps | length))]' "$DISTRIBUTION_CONFIG" | sed 's/^/matrix=/' >> "$GITHUB_OUTPUT"
          wif_provider=${WIF_PROVIDER:-$(jq -r '.gcp.workloadIdentityProvider // empty' "$DISTRIBUTION_CONFIG")}
          wif_service_account=${WIF_SERVICE_ACCOUNT:-$(jq -r '.gcp.uploaderServiceAccount // empty' "$DISTRIBUTION_CONFIG")}
          if [[ -f "$app_dir/pubspec.yaml" ]]; then
            if jq -e 'any(.apps[]; .flavor == "TODO" or .target == "TODO")' "$DISTRIBUTION_CONFIG" >/dev/null; then
              echo 'apps.json の flavor / target の TODO を確定してください' >&2
              exit 1
            fi
            if jq -e 'any(.apps[]; (.flavor // "") == "" or (.target // "") == "")' "$DISTRIBUTION_CONFIG" >/dev/null; then
              echo 'flavor / target が未設定のアプリがあります（apps.json か Baynex のアプリ設定で確定してください）' >&2
              exit 1
            fi
            echo 'app_present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'app_present=false' >> "$GITHUB_OUTPUT"
            echo "アプリ本体（$app_dir/pubspec.yaml）がまだないため、配布をスキップしました。" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -n "$wif_provider" && -n "$wif_service_account" ]]; then
            echo 'wif_ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'wif_ready=false' >> "$GITHUB_OUTPUT"
            echo '- アップロード未設定: GCP_WIF_PROVIDER / FIREBASE_UPLOADER_SERVICE_ACCOUNT' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$ANDROID_KEYSTORE_SET" == true && "$ANDROID_STORE_PASSWORD_SET" == true && "$ANDROID_ALIAS_SET" == true && "$ANDROID_KEY_PASSWORD_SET" == true ]]; then
            echo 'android_signing=true' >> "$GITHUB_OUTPUT"
          else
            echo 'android_signing=false' >> "$GITHUB_OUTPUT"
            echo '- Android リリース署名未設定（任意）: ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD' >> "$GITHUB_STEP_SUMMARY"
          fi

  android:
    needs: detect
    if: needs.detect.outputs.app_present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        index: ${{ fromJSON(needs.detect.outputs.matrix) }}
    name: Android / app ${{ matrix.index }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: koikenosalmon/baynex-agent-skills
          ref: ${{ inputs.kit-ref }}
          path: .baynex-app-distribution-kit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve distribution configuration
        run: node .baynex-app-distribution-kit/app-distribution/scripts/resolve-config.mjs
      - name: Load app configuration
        env:
          APP_INDEX: ${{ matrix.index }}
          PRODUCT_ID_OVERRIDE: ${{ vars.BAYNEX_PRODUCT_ID }}
          WIF_PROVIDER_OVERRIDE: ${{ vars.GCP_WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT_OVERRIDE: ${{ vars.FIREBASE_UPLOADER_SERVICE_ACCOUNT }}
        run: node .baynex-app-distribution-kit/app-distribution/scripts/load-app.mjs "$APP_INDEX"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Configure private Git dependencies
        env:
          GIT_DEPENDENCY_SSH_KEY: ${{ secrets.GIT_DEPENDENCY_SSH_KEY }}
          GIT_DEPENDENCY_TOKEN: ${{ secrets.GIT_DEPENDENCY_TOKEN }}
        run: node .baynex-app-distribution-kit/app-distribution/scripts/git-dependencies.mjs setup
      - name: Install dependencies
        timeout-minutes: 15
        working-directory: ${{ env.APP_DIR }}
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: flutter pub get
      - name: Configure optional release signing
        if: needs.detect.outputs.android_signing == 'true'
        working-directory: ${{ env.APP_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/upload-keystore.jks"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > "$RUNNER_TEMP/key.properties"
          ln -s "$RUNNER_TEMP/key.properties" android/key.properties
          chmod 600 "$RUNNER_TEMP/key.properties" "$RUNNER_TEMP/upload-keystore.jks"
      - id: build
        name: Build APK
        # The healthy build takes 11-15 minutes. A build that has not finished by now is stuck; stop it so the
        # log artifact below is collected instead of the job idling until someone cancels it.
        timeout-minutes: 30
        working-directory: ${{ env.APP_DIR }}
        env:
          BRANCH: ${{ github.ref_name }}
          FLAVOR: ${{ env.APP_FLAVOR }}
          TARGET: ${{ env.APP_TARGET }}
          RUN_NUMBER: ${{ github.run_number }}
          KIT: ${{ github.workspace }}/.baynex-app-distribution-kit/app-distribution/scripts
          # Nothing in the build may stop to ask a question on a runner nobody is watching.
          GIT_TERMINAL_PROMPT: '0'
          GCM_INTERACTIVE: never
          CI: 'true'
        run: |
          set -euo pipefail
          # Gradle's file-system watcher raised "Already watching path" in every healthy run before the packaging
          # phase stalled for minutes; a single-use runner gains nothing from the watcher or a resident daemon.
          mkdir -p "$HOME/.gradle"
          printf '%s\n' 'org.gradle.vfs.watch=false' 'org.gradle.daemon=false' >> "$HOME/.gradle/gradle.properties"
          log_dir="$RUNNER_TEMP/android-build-logs"
          mkdir -p "$log_dir"
          "$KIT/build-diagnostics.sh" sample "$log_dir" 300 &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          build_number=$(node "$GITHUB_WORKSPACE/.baynex-app-distribution-kit/app-distribution/scripts/build-number.mjs" --config "$DISTRIBUTION_CONFIG")
          args=(--flavor "$FLAVOR" -t "$TARGET" --release --build-number="$build_number")
          if [[ "$BRANCH" == release/* ]]; then args+=(--build-name="${BRANCH#release/}"); fi
          flutter build apk --verbose "${args[@]}" 2>&1 | tee "$log_dir/flutter-build.log"
          artifact="build/app/outputs/flutter-apk/app-${FLAVOR}-release.apk"
          test -f "$artifact"
          echo "artifact=$PWD/$artifact" >> "$GITHUB_OUTPUT"
      - name: Collect Android build logs
        if: failure() || cancelled()
        env:
          KIT: ${{ github.workspace }}/.baynex-app-distribution-kit/app-distribution/scripts
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GIT_DEPENDENCY_TOKEN: ${{ secrets.GIT_DEPENDENCY_TOKEN }}
          GIT_DEPENDENCY_SSH_KEY: ${{ secrets.GIT_DEPENDENCY_SSH_KEY }}
        run: |
          log_dir="$RUNNER_TEMP/android-build-logs"
          mkdir -p "$log_dir"
          "$KIT/build-diagnostics.sh" collect "$log_dir" || true
          node "$KIT/scrub-log.mjs" --env STORE_PASSWORD --env KEY_ALIAS --env KEY_PASSWORD --env GIT_DEPENDENCY_TOKEN --env GIT_DEPENDENCY_SSH_KEY "$log_dir" || rm -rf "$log_dir"
      - name: Upload Android build logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs${{ matrix.index != 0 && format('-{0}', matrix.index) || '' }}
          path: ${{ runner.temp }}/android-build-logs
          if-no-files-found: ignore
          retention-days: 7
      - name: Write release notes
        run: .baynex-app-distribution-kit/app-distribution/scripts/baynex-release-notes.sh > release-notes.txt
      - id: google_auth
        name: Authorize Firebase upload
        if: needs.detect.outputs.wif_ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
      - name: Start Firebase App Distribution
        if: needs.detect.outputs.wif_ready == 'true'
        env:
          FIREBASE_APP_ID: ${{ env.FIREBASE_APP_ID_ANDROID }}
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
        run: node .baynex-app-distribution-kit/app-distribution/scripts/firebase-activate.mjs "$FIREBASE_APP_ID"
      - id: upload
        name: Upload to Firebase App Distribution
        if: needs.detect.outputs.wif_ready == 'true'
        timeout-minutes: 20
        env:
          FIREBASE_APP_ID: ${{ env.FIREBASE_APP_ID_ANDROID }}
          ARTIFACT: ${{ steps.build.outputs.artifact }}
        run: npx -y firebase-tools@14 appdistribution:distribute "$ARTIFACT" --app "$FIREBASE_APP_ID" --release-notes-file release-notes.txt
      - name: Remove private Git dependency credentials
        if: always()
        run: node .baynex-app-distribution-kit/app-distribution/scripts/git-dependencies.mjs cleanup
      - name: Remove signing files
        if: always()
        working-directory: ${{ env.APP_DIR }}
        run: rm -f android/key.properties "$RUNNER_TEMP/key.properties" "$RUNNER_TEMP/upload-keystore.jks"
      - name: Distribution summary
        if: always()
        env:
          APP_NAME: ${{ env.APP_DISPLAY_NAME }}
          PRODUCT_ID: ${{ env.PRODUCT_ID }}
          COMMIT: ${{ github.sha }}
          WIF_READY: ${{ needs.detect.outputs.wif_ready }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          UPLOAD_RESULT: ${{ steps.upload.outcome }}
        run: |
          echo "### $APP_NAME / Android" >> "$GITHUB_STEP_SUMMARY"
          echo "- ビルド: $BUILD_RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$WIF_READY" == true ]]; then echo "- Firebase 配布: $UPLOAD_RESULT" >> "$GITHUB_STEP_SUMMARY"; else echo '- Firebase 配布: WIF 未設定のためビルドのみ' >> "$GITHUB_STEP_SUMMARY"; fi
          if [[ -n "$PRODUCT_ID" ]]; then echo "- [Baynex でこのコミットを開く](https://preview.baynex.jp/products/$PRODUCT_ID?view=apps&commit=$COMMIT)" >> "$GITHUB_STEP_SUMMARY"; fi

  ios:
    needs: detect
    if: needs.detect.outputs.app_present == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        index: ${{ fromJSON(needs.detect.outputs.matrix) }}
    name: iOS / app ${{ matrix.index }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: koikenosalmon/baynex-agent-skills
          ref: ${{ inputs.kit-ref }}
          path: .baynex-app-distribution-kit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve distribution configuration
        run: node .baynex-app-distribution-kit/app-distribution/scripts/resolve-config.mjs
      - name: Load app configuration
        env:
          APP_INDEX: ${{ matrix.index }}
          PRODUCT_ID_OVERRIDE: ${{ vars.BAYNEX_PRODUCT_ID }}
          WIF_PROVIDER_OVERRIDE: ${{ vars.GCP_WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT_OVERRIDE: ${{ vars.FIREBASE_UPLOADER_SERVICE_ACCOUNT }}
        run: node .baynex-app-distribution-kit/app-distribution/scripts/load-app.mjs "$APP_INDEX"
      - id: google_auth
        name: Authorize Secret Manager and Firebase
        if: needs.detect.outputs.wif_ready == 'true'
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
      - id: credentials
        name: Load Apple account key (Baynex OIDC, then Secret Manager, then GitHub Secrets)
        timeout-minutes: 5
        env:
          APPLE_ACCOUNT: ${{ env.APP_APPLE_ACCOUNT }}
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: node .baynex-app-distribution-kit/app-distribution/scripts/apple-credentials.mjs load "$APPLE_ACCOUNT" "$RUNNER_TEMP/apple-account"
      - uses: subosito/flutter-action@v2
        if: steps.credentials.outcome == 'success'
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Configure private Git dependencies
        if: steps.credentials.outcome == 'success'
        env:
          GIT_DEPENDENCY_SSH_KEY: ${{ secrets.GIT_DEPENDENCY_SSH_KEY }}
          GIT_DEPENDENCY_TOKEN: ${{ secrets.GIT_DEPENDENCY_TOKEN }}
        run: node .baynex-app-distribution-kit/app-distribution/scripts/git-dependencies.mjs setup
      - name: Install dependencies
        if: steps.credentials.outcome == 'success'
        timeout-minutes: 15
        working-directory: ${{ env.APP_DIR }}
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: flutter pub get
      - id: prepare
        name: Register bundle ID and tester devices
        if: steps.credentials.outcome == 'success'
        timeout-minutes: 10
        env:
          APP_STORE_CONNECT_ISSUER_ID_FILE: ${{ runner.temp }}/apple-account/app-store-connect-issuer-id
          APP_STORE_CONNECT_KEY_ID_FILE: ${{ runner.temp }}/apple-account/app-store-connect-key-id
          APP_STORE_CONNECT_KEY_P8_FILE: ${{ runner.temp }}/apple-account/app-store-connect.p8
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          FIREBASE_APP_ID: ${{ env.FIREBASE_APP_ID_IOS }}
          APP_ID: ${{ env.APP_ID }}
          APP_TEAM_OVERRIDE: ${{ env.APP_APPLE_TEAM_ID }}
          WIF_READY: ${{ needs.detect.outputs.wif_ready }}
        run: |
          set -euo pipefail
          umask 077
          node .baynex-app-distribution-kit/app-distribution/scripts/app-store-connect.mjs ensure-bundle-ids "$APP_ID" > "$RUNNER_TEMP/bundles.json"
          team=$(jq -r --arg id "$APP_ID" '.bundleIds[] | select(.id == $id) | .teamId // empty' "$RUNNER_TEMP/bundles.json")
          team=${APP_TEAM_OVERRIDE:-$team}
          [[ "$team" =~ ^[A-Z0-9]{10}$ ]] || { echo 'Apple Team ID を取得できません' >&2; exit 1; }
          echo "team_id=$team" >> "$GITHUB_OUTPUT"
          if [[ "$WIF_READY" != true ]]; then echo 'Firebase WIF が未設定のため端末登録を確認できません' >&2; exit 1; fi
          node .baynex-app-distribution-kit/app-distribution/scripts/firebase-udids.mjs "$FIREBASE_APP_ID" > "$RUNNER_TEMP/tester-udids.json"
          node .baynex-app-distribution-kit/app-distribution/scripts/app-store-connect.mjs register-devices "$RUNNER_TEMP/tester-udids.json" > "$RUNNER_TEMP/device-counts.json"
          jq -r '"登録済み: \(.existing)、新規登録: \(.created)、対象: \(.requested)"' "$RUNNER_TEMP/device-counts.json" >> "$GITHUB_STEP_SUMMARY"
      - id: build
        name: Build cloud-signed IPA
        if: steps.credentials.outcome == 'success'
        # Build, archive and export together take about 15 minutes.
        timeout-minutes: 45
        working-directory: ${{ env.APP_DIR }}
        env:
          FLAVOR: ${{ env.APP_FLAVOR }}
          TARGET: ${{ env.APP_TARGET }}
          RUN_NUMBER: ${{ github.run_number }}
          BRANCH: ${{ github.ref_name }}
          TEAM_ID: ${{ steps.prepare.outputs.team_id }}
          KIT: ${{ github.workspace }}/.baynex-app-distribution-kit/app-distribution/scripts
          GIT_TERMINAL_PROMPT: '0'
          IOS_SIGNING_MODE: ${{ vars.BAYNEX_IOS_SIGNING || 'auto' }}
          APPLE_ACCOUNT: ${{ env.APP_APPLE_ACCOUNT }}
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          # install-profile talks to App Store Connect, so it needs the same key the
          # earlier steps used; without it the build stops before it can sign.
          APP_STORE_CONNECT_ISSUER_ID_FILE: ${{ runner.temp }}/apple-account/app-store-connect-issuer-id
          APP_STORE_CONNECT_KEY_ID_FILE: ${{ runner.temp }}/apple-account/app-store-connect-key-id
          APP_STORE_CONNECT_KEY_P8_FILE: ${{ runner.temp }}/apple-account/app-store-connect.p8
        run: |
          set -euo pipefail
          build_number=$(node "$GITHUB_WORKSPACE/.baynex-app-distribution-kit/app-distribution/scripts/build-number.mjs" --config "$DISTRIBUTION_CONFIG")
          args=(--release --no-codesign --flavor "$FLAVOR" -t "$TARGET" --build-number="$build_number")
          if [[ "$BRANCH" == release/* ]]; then args+=(--build-name="${BRANCH#release/}"); fi
          # Cloud signing only works where Xcode already holds the private key of a
          # certificate it created. A fresh runner holds none, so it tries to mint
          # another distribution certificate and Apple refuses. When the account
          # carries one, put it in a keychain that lives and dies with this run.
          manual_material=false
          if [[ -f "$RUNNER_TEMP/apple-account/distribution.p12" ]]; then
            keychain="$RUNNER_TEMP/baynex-signing.keychain-db"
            keychain_password="$(openssl rand -base64 24)"
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 3600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            p12_password=""
            if [[ -f "$RUNNER_TEMP/apple-account/distribution.p12.password" ]]; then p12_password="$(cat "$RUNNER_TEMP/apple-account/distribution.p12.password")"; fi
            security import "$RUNNER_TEMP/apple-account/distribution.p12" -k "$keychain" -P "$p12_password" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
            # shellcheck disable=SC2046
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            # One ad-hoc profile per signed target (the app and every extension), keyed by bundle ID.
            targets_json=$(ruby "$KIT/ios-project-signing.rb" list ios/Runner.xcodeproj "$FLAVOR")
            printf '{}' > "$RUNNER_TEMP/ios-profiles.json"
            while IFS= read -r target_bundle_id; do
              profile_json=$(node "$KIT/app-store-connect.mjs" install-profile "$target_bundle_id")
              TARGET_BUNDLE_ID="$target_bundle_id" PROFILE_JSON="$profile_json" python3 - "$RUNNER_TEMP/ios-profiles.json" <<'PYPROFILES'
          import json, os, sys
          with open(sys.argv[1]) as handle:
              profiles = json.load(handle)
          profiles[os.environ['TARGET_BUNDLE_ID']] = json.loads(os.environ['PROFILE_JSON'])['name']
          with open(sys.argv[1], 'w') as handle:
              json.dump(profiles, handle)
          PYPROFILES
            done < <(printf '%s' "$targets_json" | python3 -c 'import json,sys; print("\n".join(dict.fromkeys(t["bundleId"] for t in json.load(sys.stdin))))')
            manual_material=true
            echo "署名: Secret Manager の配布証明書と API のプロファイルを使用"
          else
            echo "署名: 配布証明書の設定が無いため cloud signing"
          fi
          flutter build ios "${args[@]}"
          major=$(xcodebuild -version | awk '/^Xcode / {split($2,a,"."); print a[1]}')
          method=ad-hoc
          if [[ "$major" =~ ^[0-9]+$ ]] && (( major >= 16 )); then method=release-testing; fi
          TEAM_ID="$TEAM_ID" EXPORT_METHOD="$method" MANUAL_MATERIAL="$manual_material" python3 - <<'PYPLIST'
          import json, os, plistlib
          options = {'method': os.environ['EXPORT_METHOD'], 'teamID': os.environ['TEAM_ID']}
          # With our own distribution identity and profiles (app and extensions) nothing is left to Xcode to manage.
          if os.environ['MANUAL_MATERIAL'] == 'true':
              with open(os.environ['RUNNER_TEMP'] + '/ios-profiles.json') as handle:
                  options['provisioningProfiles'] = json.load(handle)
              options['signingStyle'] = 'manual'
              options['signingCertificate'] = 'Apple Distribution'
          else:
              options['signingStyle'] = 'automatic'
          with open(os.environ['RUNNER_TEMP'] + '/ExportOptions.plist', 'wb') as output:
              plistlib.dump(options, output)
          PYPLIST
          export_args=(-exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" -exportPath "$RUNNER_TEMP/ios-export")
          if [[ "$manual_material" == true ]]; then
            # Manual signing end to end: the distribution identity sits in the temporary keychain and every target has its
            # own ad-hoc profile. No -allowProvisioningUpdates and no API key here, so Xcode has no way to create an
            # Apple Development certificate (ephemeral runners lose its private key, and Apple caps certificates per team).
            ruby "$KIT/ios-project-signing.rb" apply ios/Runner.xcodeproj "$FLAVOR" "$TEAM_ID" "$RUNNER_TEMP/ios-profiles.json"
            xcodebuild archive -workspace ios/Runner.xcworkspace -scheme "$FLAVOR" -archivePath "$RUNNER_TEMP/Runner.xcarchive"
            xcodebuild "${export_args[@]}" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          else
            # No distribution.p12 in the account config: only Xcode cloud signing can archive. It creates an Apple Development
            # certificate through the API on every run, so report how many already exist before adding another one.
            dev_certs=$(node "$KIT/app-store-connect.mjs" development-certificates 2>/dev/null || true)
            if [[ -n "$dev_certs" ]] && [[ "$(printf '%s' "$dev_certs" | jq -r '.warn // false')" == true ]]; then
              echo "::warning::API 経由で作られた Apple Development 証明書が $(printf '%s' "$dev_certs" | jq -r '.api') 件あります。cloud signing は runner ごとに新規作成し、上限に達すると archive が失敗します。distributionP12Secret を設定して手動署名に切り替えてください"
            fi
            key_id=$(cat "$RUNNER_TEMP/apple-account/app-store-connect-key-id")
            issuer_id=$(cat "$RUNNER_TEMP/apple-account/app-store-connect-issuer-id")
            auth=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/apple-account/app-store-connect.p8" -authenticationKeyID "$key_id" -authenticationKeyIssuerID "$issuer_id")
            xcodebuild archive -workspace ios/Runner.xcworkspace -scheme "$FLAVOR" -archivePath "$RUNNER_TEMP/Runner.xcarchive" "${auth[@]}" CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$TEAM_ID"
            # Xcode cloud signing is documented for App Store / Developer ID / Enterprise; ad-hoc exports often fail with these messages.
            cloud_failure='Cloud signing permission error|No signing certificate .?(iOS|Apple) Distribution.? found|No profiles for .+ were found'
            exported=false
            if [[ "$IOS_SIGNING_MODE" != manual ]]; then
              if xcodebuild "${export_args[@]}" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" "${auth[@]}" 2>&1 | tee "$RUNNER_TEMP/export-cloud.log"; then exported=true; fi
            fi
            if [[ "$exported" != true ]]; then
              if [[ "$IOS_SIGNING_MODE" == cloud ]]; then echo 'cloud signing の export に失敗しました（BAYNEX_IOS_SIGNING=cloud のためフォールバックしません）' >&2; exit 1; fi
              if [[ "$IOS_SIGNING_MODE" == auto ]] && ! grep -Eq "$cloud_failure" "$RUNNER_TEMP/export-cloud.log"; then echo 'cloud signing 以外の理由で export に失敗しました（手動署名にはフォールバックしません）' >&2; exit 1; fi
              echo '::warning::cloud signing で ad-hoc export できないため、管理された手動署名（Apple Distribution 証明書 + IOS_APP_ADHOC プロファイル）に切り替えます'
              rm -rf "$RUNNER_TEMP/ios-export" "$RUNNER_TEMP/ios-signing"
              bundle_ids=$(python3 - "$RUNNER_TEMP/Runner.xcarchive" <<'PYIDS'
          import glob, plistlib, sys
          app = glob.glob(sys.argv[1] + '/Products/Applications/*.app')[0]
          ids = []
          for path in [app + '/Info.plist'] + glob.glob(app + '/PlugIns/*.appex/Info.plist'):
              with open(path, 'rb') as handle:
                  ids.append(plistlib.load(handle)['CFBundleIdentifier'])
          print(','.join(dict.fromkeys(ids)))
          PYIDS
              )
              node "$KIT/ios-signing.mjs" prepare --out "$RUNNER_TEMP/ios-signing" --team "$TEAM_ID" --method "$method" --bundle-ids "$bundle_ids" --account "$APPLE_ACCOUNT" > "$RUNNER_TEMP/ios-signing.json"
              jq -r '"署名: 証明書 \(.certificateId)（新規作成: \(.certificateCreated)）、端末 \(.devices) 台、プロファイル \(.profiles | length) 件"' "$RUNNER_TEMP/ios-signing.json" >> "$GITHUB_STEP_SUMMARY"
              "$KIT/ios-keychain.sh" install "$RUNNER_TEMP/ios-signing"
              xcodebuild "${export_args[@]}" -exportOptionsPlist "$RUNNER_TEMP/ios-signing/ExportOptions.plist"
            fi
          fi
          artifact=$(find "$RUNNER_TEMP/ios-export" -maxdepth 1 -name '*.ipa' -type f -print -quit)
          test -n "$artifact"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - name: Write release notes
        if: steps.credentials.outcome == 'success'
        run: .baynex-app-distribution-kit/app-distribution/scripts/baynex-release-notes.sh > release-notes.txt
      - id: upload_auth
        name: Refresh Firebase upload authorization
        if: steps.credentials.outcome == 'success' && needs.detect.outputs.wif_ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
      - name: Start Firebase App Distribution
        if: steps.credentials.outcome == 'success' && needs.detect.outputs.wif_ready == 'true'
        env:
          FIREBASE_APP_ID: ${{ env.FIREBASE_APP_ID_IOS }}
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.upload_auth.outputs.access_token }}
        run: node .baynex-app-distribution-kit/app-distribution/scripts/firebase-activate.mjs "$FIREBASE_APP_ID"
      - id: upload
        name: Upload to Firebase App Distribution
        if: steps.credentials.outcome == 'success' && needs.detect.outputs.wif_ready == 'true'
        timeout-minutes: 20
        env:
          FIREBASE_APP_ID: ${{ env.FIREBASE_APP_ID_IOS }}
          ARTIFACT: ${{ steps.build.outputs.artifact }}
        run: npx -y firebase-tools@14 appdistribution:distribute "$ARTIFACT" --app "$FIREBASE_APP_ID" --release-notes-file release-notes.txt
      - name: Remove private Git dependency credentials
        if: always()
        run: node .baynex-app-distribution-kit/app-distribution/scripts/git-dependencies.mjs cleanup
      - name: Remove temporary signing material
        if: always()
        run: |
          # shellcheck disable=SC2046
          security list-keychains -d user -s $(security list-keychains -d user | tr -d '"' | grep -v baynex-signing || true) || true
          security delete-keychain "$RUNNER_TEMP/baynex-signing.keychain-db" 2>/dev/null || true
          "$GITHUB_WORKSPACE/.baynex-app-distribution-kit/app-distribution/scripts/ios-keychain.sh" cleanup "$RUNNER_TEMP/ios-signing" || true
          rm -rf "$RUNNER_TEMP/apple-account" "$RUNNER_TEMP/ios-signing" && rm -f "$RUNNER_TEMP/export-cloud.log" "$RUNNER_TEMP/ios-signing.json" "$RUNNER_TEMP/ExportOptions.plist" "$RUNNER_TEMP/bundles.json" "$RUNNER_TEMP/tester-udids.json" "$RUNNER_TEMP/device-counts.json"
      - name: Distribution summary
        if: always()
        env:
          APP_NAME: ${{ env.APP_DISPLAY_NAME }}
          PRODUCT_ID: ${{ env.PRODUCT_ID }}
          COMMIT: ${{ github.sha }}
          SIGNING_READY: ${{ steps.credentials.outcome == 'success' }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          UPLOAD_RESULT: ${{ steps.upload.outcome }}
        run: |
          echo "### $APP_NAME / iOS" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$SIGNING_READY" != true ]]; then
            echo '- Apple アカウントのキーを取得できませんでした。' >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "- Apple 鍵の取得経路: ${APPLE_KEY_SOURCE:-不明}"
              echo "- ビルド: $BUILD_RESULT"
              echo "- Firebase 配布: $UPLOAD_RESULT"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -n "$PRODUCT_ID" ]]; then echo "- [Baynex でこのコミットを開く](https://preview.baynex.jp/products/$PRODUCT_ID?view=apps&commit=$COMMIT)" >> "$GITHUB_STEP_SUMMARY"; fi
